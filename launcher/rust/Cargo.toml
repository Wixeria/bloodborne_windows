[package]
name = "bloodborne-launcher"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Native bbport Windows launcher built with GPUI Kit"

[features]
default = ["gui"]
gui = ["dep:gpui-kit", "dep:rfd"]
ui-validation = ["gui", "gpui-kit/test-support"]

[dependencies]
anyhow = "1"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
gpui-kit = { version = "=0.7.1", optional = true }
rfd = { version = "0.15", optional = true }

[build-dependencies]
embed-resource = "=3.0.12"

[[bin]]
name = "BloodborneLauncher"
path = "src/main.rs"
required-features = ["gui"]

[profile.dev]
debug = 0

[profile.release]
strip = true
